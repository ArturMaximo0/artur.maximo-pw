<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionários</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class = "container">
        <div class = "header">
            <span>Cadastro de Funcionários</span>
            <button type="button" id="new">Incluir</button>
        </div>
        <div class = "divTable">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Função</th>
                        <th>Salário</th>
                        <th class="acao">Editar</th>
                        <th class="acao">Excluir</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
        <div class="modal-container">
            <div class = "modal">
                <form id="funcionario-form">
                    <label for="m-nome">Nome</label>
                    <input id="m-nome" name="nome" type="text" maxlength="100" required />

                    <label for="m-funcao">Função</label>
                    <input id="m-funcao" name="funcao" type="text" maxlength="100" required />

                    <label for="m-salario">Salário</label>
                    <input id="m-salario" name="salario" type="number" min="0" max="99999999.99" step="0.01" required />

                    <p id="mensagem-erro" role="alert"></p>
                    <button type="submit" id="btnSalvar">Salvar</button>
                    <button type="button" id="cancelar">Cancelar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
